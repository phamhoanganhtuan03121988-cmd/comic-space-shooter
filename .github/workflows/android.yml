# Packages the web game as an Android debug APK with Capacitor, smoke-tests
# it on an Android emulator and commits the APK + test screenshots back to
# the branch (dist/android/, docs/android/). The web game (dist/index.html)
# is the only source: the APK just wraps it.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [claude/practical-dijkstra-un5f2g]
    paths:
      - 'src/**'
      - 'index.html'
      - 'styles.css'
      - 'icon.svg'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tools/build*.mjs'
      - 'tools/android-*.mjs'
      - '.github/workflows/android.yml'

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build web game + sync into the Android project
        run: npm run android:sync
      - name: Gradle assembleDebug
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Collect APK
        run: |
          mkdir -p dist/android
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/android/CosmicFarmDefenders-debug.apk
          ls -la dist/android
          "$ANDROID_HOME"/build-tools/*/aapt2 dump badging dist/android/CosmicFarmDefenders-debug.apk | head -5 || true
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/android/CosmicFarmDefenders-debug.apk

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist/android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator smoke test (real touch input via adb)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none
          script: mkdir -p docs/android; adb logcat -c; (adb logcat -v time > docs/android/logcat.txt 2>&1 &); timeout 12m node tools/android-smoke.mjs dist/android/CosmicFarmDefenders-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-results
          path: docs/android

  publish:
    needs: [build, emulator]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist/android
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: emulator-results
          path: docs/android
      - name: Commit APK + emulator results to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/android/CosmicFarmDefenders-debug.apk docs/android || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Android debug APK + emulator smoke results (CI build of ${GITHUB_SHA::7}) [skip ci]"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
